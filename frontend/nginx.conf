server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service (compose service name: backend).
    # Use Docker's embedded DNS (127.0.0.11) with a variable so nginx re-resolves
    # the backend on each request — otherwise it caches the IP at startup and 502s
    # after the backend container is recreated on a redeploy.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
