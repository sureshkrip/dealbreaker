[project]
name = "dealbreaker"
version = "0.1.0"
description = "Dealbreaker — self-hosted price tracker (FastAPI backend). A Python port of PriceBuddy."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Suresh Kripashankar", email = "sureshkrip@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
    "selectolax>=0.3.21",
    "apscheduler>=3.10.4",
    "pydantic-settings>=2.6.0",
]

[project.scripts]
dealbreaker = "dealbreaker.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends()/Query() default-argument pattern is idiomatic.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
